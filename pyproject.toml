[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyresideo-firstalert"
version = "1.2.1"
description = "Async Python client for the Resideo First Alert smart smoke/CO detector API (unmaintained)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Zack Wagner", email = "zack@zackwag.com" },
]
keywords = ["resideo", "first-alert", "smoke-detector", "iot", "home-automation"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/zackwag/pyresideo-firstalert"
Repository = "https://github.com/zackwag/pyresideo-firstalert"
Issues = "https://github.com/zackwag/pyresideo-firstalert/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/resideo_firstalert_api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ005 (datetime.now() without tz): this codebase never mixes naive and
# timezone-aware datetimes -- every datetime.now() call is only ever
# compared against another datetime.now() call (token-expiry / cache
# staleness tracking). Flagging all ~20 call sites for a hypothetical
# future mixing risk that doesn't exist today isn't worth the churn.
ignore = ["DTZ005"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
